name: gym_management
description: Gym Management Application Flutter Project.
publish_to: 'none'  # Prevent accidental publishing

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0

  firebase_core: ^2.30.0
  firebase_auth: ^4.19.3
  cloud_firestore: ^4.17.3

  shared_preferences: ^2.2.3
  toastification: ^2.0.0
  url_launcher: ^6.3.0
  google_nav_bar: ^5.0.6
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/application_logo.png"
  background_color_ios: "#0f0d1a"

flutter:
  uses-material-design: true

  assets:
    - assets/application_logo.png
    - assets/company_logo.png
    - assets/splash.png
